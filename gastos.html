<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Gastos - 3ro Azul</title>
  <link rel="icon" type="image/png" href="assets/icon-32.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d3557">

<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 24px 16px;
    background-image: url('assets/fondo.png'); background-size: cover;
    background-position: center bottom; background-repeat: no-repeat; background-color: #bfe3fb;
  }
  .logo { display: block; width: 90px; margin: 0 auto 12px; }
  .card { max-width: 480px; margin: 0 auto; background: rgba(255,255,255,0.96); border-radius: 14px; padding: 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size: 20px; color: #7f5539; margin: 0 0 4px; text-align: center; }
  .sub { color: #555; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin: 14px 0 6px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #ccd6e0; border-radius: 8px; font-size: 14px; }
  button { width: 100%; margin-top: 22px; padding: 13px; background: #7f5539; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg { margin-top: 14px; font-size: 14px; text-align: center; }
  #msg.ok { color: #2a9d8f; }
  #msg.err { color: #e63946; }
  nav { max-width: 480px; margin: 0 auto 12px; text-align: center; font-size: 13px; }
  nav a { color: #7f5539; text-decoration: none; margin: 0 8px; }
</style>
</head>
<body>
  <nav><a href="index.html">Inicio</a> · <a href="aporte.html">Cargar aporte</a> · <a href="dashboard.html">Ver resumen</a></nav>
  <div class="card">
    <img class="logo" src="assets/logo.png" alt="Colegio de la Asunción">
    <h1>Registro de Gastos</h1>
    <div class="sub">Cargá acá los gastos del comité, con su comprobante correspondiente.</div>

    <form id="form">
      <label>Comité</label>
      <select id="comite">
        <option>Comité Cumpleaños</option>
        <option>Comité Caacupe</option>
        <option>Comité Semana Santa y Corpus</option>
        <option>Comité día del Maestro</option>
        <option>Comité día del niño</option>
        <option>Comité día de la amistad</option>
        <option>Comité día del folklore</option>
        <option>Comité Pesebre y Canasta de Navidad</option>
        <option>Comité Despedida</option>
        <option>Comite Vestuario</option>
      </select>

      <label>Categoría</label>
      <input type="text" id="categoria" placeholder="Ej: Compras, Regalos, Evento" required>

      <label>Descripción</label>
      <textarea id="descripcion" rows="2" required></textarea>

      <label>Monto Gasto</label>
      <input type="number" id="monto" required min="0">

      <label>Divisor (si aplica)</label>
      <input type="text" id="divisor" placeholder="Ej: entre 20 alumnos">

      <label>Quien registra este gasto</label>
      <input type="text" id="quienRegistra" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Comprobante de gasto</label>
      <input type="file" id="comprobante" accept="image/*,.pdf">

      <button type="submit" id="btn">Registrar gasto</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxoxnziXecOQ0UUSZRW9TvpeQA_opdMPif_BvxZdSc6-Ugem0mr4dbKNje7_J1LkD_z/exec';

    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.textContent = 'Enviando...';
      msg.className = '';

      try {
        const file = document.getElementById('comprobante').files[0];
        let base64 = '', nombre = '', tipo = '';
        if (file) {
          base64 = await fileToBase64(file);
          nombre = file.name;
          tipo = file.type;
        }

        const data = {
          action: 'gasto',
          comite: document.getElementById('comite').value,
          categoria: document.getElementById('categoria').value,
          descripcion: document.getElementById('descripcion').value,
          monto: document.getElementById('monto').value,
          divisor: document.getElementById('divisor').value,
          quienRegistra: document.getElementById('quienRegistra').value,
          email: document.getElementById('email').value,
          comprobanteBase64: base64,
          comprobanteNombre: nombre,
          comprobanteTipo: tipo,
        };

        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Error al guardar');

        msg.textContent = '✔ Gasto registrado.';
        msg.className = 'ok';
        form.reset();
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.className = 'err';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
