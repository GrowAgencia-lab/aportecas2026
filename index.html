<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aporte 3ro Azul</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    background-image: url('assets/fondo.png');
    background-size: cover;
    background-position: center bottom;
    background-repeat: no-repeat;
    background-color: #bfe3fb;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    box-sizing: border-box;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: rgba(255,255,255,0.94);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    text-align: center;
  }
  .logo { width: 120px; margin-bottom: 12px; }
  h1 { font-size: 20px; color: #1d3557; margin: 0 0 4px; }
  .sub { color: #555; font-size: 13px; margin-bottom: 26px; }
  a.boton {
    display: block;
    text-decoration: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    transition: transform 0.1s;
  }
  a.boton:active { transform: scale(0.98); }
  .btn-aporte { background: #1d3557; color: #fff; }
  .btn-gasto { background: #7f5539; color: #fff; }
  .btn-resumen { background: #fff; color: #1d3557; border: 2px solid #1d3557; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/logo.png" alt="Colegio de la Asunción">
    <h1>Aporte 3ro Azul</h1>
    <div class="sub">Este espacio nos acompaña durante el año en la organización de pagos y actividades de nuestros chicos.</div>

    <a class="boton btn-aporte" href="aporte.html">💰 Cargar aporte</a>
    <a class="boton btn-gasto" href="gastos.html">🧾 Cargar gasto</a>
    <a class="boton btn-resumen" href="dashboard.html">📊 Ver resumen</a>
  </div>
</body>
</html>
